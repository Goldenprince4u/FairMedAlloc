[supervisord]
nodaemon=true
user=root

; ── Apache Web Server ───────────────────────────────────────────────────────
[program:apache2]
command=apache2-foreground
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Python ML Scoring Service ────────────────────────────────────────────────
[program:ml_service]
command=/bin/sh -c 'if [ "${FAIRMED_ENABLE_ML_SERVICE:-1}" = "1" ]; then exec /opt/venv/bin/python /var/www/html/ml_models/ml_service.py "${FAIRMED_ML_BIND_HOST:-127.0.0.1}" "${FAIRMED_ML_BIND_PORT:-5051}"; else echo "FairMedAlloc: ML service disabled by FAIRMED_ENABLE_ML_SERVICE=0"; exec sleep infinity; fi'
autostart=true
autorestart=true
user=www-data
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Allocation Job Worker ────────────────────────────────────────────────────
; The worker_launcher.php script handles its own DB retry loop (up to 120 s)
; so supervisord only needs to restart it if it crashes AFTER a successful
; connection — not during the initial cold-start DNS wait.
;
; startsecs=130 : supervisord waits 130 s before deciding the process is
;                 "running". If the process exits before that, it counts as
;                 a failed start (startretries applies). 130 s > the 120 s
;                 DB_CONNECT_TIMEOUT in worker_launcher.php so a clean start
;                 is always recognised correctly.
;
; startretries=3: after 3 failed starts supervisord marks it FATAL and
;                 stops retrying — prevents the crash-loop in the logs.
;
; autorestart=unexpected: only restart if the process exits with an
;                 unexpected code (i.e. not 0). A clean exit (job done)
;                 is not restarted; a crash (exit 1) is.
[program:worker]
command=/bin/sh -c 'if [ "${FAIRMED_ENABLE_WORKER:-1}" = "1" ]; then exec php /var/www/html/worker_launcher.php; else echo "FairMedAlloc: worker launcher disabled by FAIRMED_ENABLE_WORKER=0"; exec sleep infinity; fi'
autostart=true
autorestart=unexpected
startsecs=130
startretries=3
exitcodes=0
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
